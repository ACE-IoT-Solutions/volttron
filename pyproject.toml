[project]
name = "volttron"
version = "9.0.4"
description = "Agent Execution Platform with 8.1.3 enhancements"
authors = [{name = "Volttron Team", email = "volttron@pnnl.gov"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "gevent>=24.2.1",
    "grequests>=0.7.0",
    "requests>=2.31.0",
    "idna<3,>=2.5",
    "ply>=3.11",
    "prometheus-client>=0.20.0",
    "psutil>=5.9.1",
    "python-dateutil>=2.8.2",
    "pytz>=2022.1",
    "PyYAML>=6.0",
    "setuptools>=40.0.0,<=70.0.0",
    "tzlocal>=2.1",
    "cryptography>=37.0.4",
    "watchdog<5.0",
    "watchdog-gevent>=0.1.1",
    "deprecated>=1.2.14",
    "pyzmq>=26.0.2",
    "wheel>=0.30",
]

[project.optional-dependencies]
crate = ["crate>=0.27.1"]
databases = [
    "mysql-connector-python>=8.0.30",
    "pymongo>=4.5.0",
    "crate>=0.27.1",
    "influxdb>=5.3.1",
    "psycopg2-binary>=2.9.7"
]
documentation = [
    "mock>=4.0.3",
    "docutils<0.18",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx>=5.1.1",
    "m2r2>=0.3.2",
    "sphinxcontrib-mermaid"
]
drivers = [
    "pymodbus>=2.5.3",
    "bacpypes>=0.16.7",
    "modbus-tk>=1.1.2",
    "pyserial>=3.5",
    "paho-mqtt>=1.6.1"
]
testing = [
    "mock>=4.0.3",
    "pytest>=7.1.2",
    "pytest-timeout>=2.1.0",
    "pytest-rerunfailures>=10.2",
    "websocket-client>=1.2.2",
    "deepdiff>=5.8.1",
    "docker>=5.0.3",
    "pytest-asyncio>=0.19.0"
]
web = [
    "ws4py>=0.5.1",
    "PyJWT>=1.7.1",
    "Jinja2>=3.1.2",
    "passlib>=1.7.4",
    "argon2-cffi>=21.3.0",
    "Werkzeug>=2.2.1",
    "treelib>=1.6.1"
]

[project.scripts]
volttron = "volttron.platform.main:_main"
volttron-ctl = "volttron.platform.control.control_parser:_main"
volttron-pkg = "volttron.platform.packaging:_main"
volttron-cfg = "volttron.platform.config:_main"
vctl = "volttron.platform.control.control_parser:_main"
vpkg = "volttron.platform.packaging:_main"
vcfg = "volttron.platform.config:_main"
volttron-upgrade = "volttron.platform.upgrade.upgrade_volttron:_main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["volttron", "volttron_data", "volttrontesting", "services"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.csv", "*.yaml", "*.yml"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "pytest>=7.1.2",
    "pytest-cov>=4.0.0"
]